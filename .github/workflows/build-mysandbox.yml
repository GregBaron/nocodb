name: "Build MySandbox Custom Image"

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gregbaron/nocodb-mysandbox

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          export NODE_OPTIONS="--max_old_space_size=16384"
          pnpm install --ignore-scripts

      - name: Build nocodb-sdk
        run: pnpm --filter=nocodb-sdk run build

      - name: Build nocodb backend (generates docker/main.js)
        run: pnpm --filter=nocodb run docker:build

      - name: Clean nc-gui build cache
        run: |
          rm -rf packages/nc-gui/.nuxt packages/nc-gui/.output
          echo "Cleared .nuxt and .output directories"

      - name: Verify security middleware content
        run: |
          echo "=== Security Middleware Content ==="
          cat packages/nc-gui/middleware/02.security.global.ts
          echo "=================================="

      - name: Build nc-gui (frontend)
        run: |
          export NODE_OPTIONS="--max_old_space_size=16384"
          pnpm --filter=nc-gui run generate

      - name: Copy frontend to Docker context
        run: |
          mkdir -p packages/nocodb/docker/nc-gui
          cp -r packages/nc-gui/.output/public/* packages/nocodb/docker/nc-gui/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./packages/nocodb
          file: ./packages/nocodb/Dockerfile.local
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Disable cache to ensure fresh build with iframe fix
          no-cache: true
